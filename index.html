<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>Ancient Duel</title>


<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    overflow:hidden;

    background:#000;

}


canvas{

    display:block;

    width:100vw;

    height:100vh;

}



#msg{

position:absolute;

top:80px;

left:50%;

transform:translateX(-50%);

color:white;

font-size:30px;

font-weight:bold;

text-shadow:
0 0 10px black;

opacity:0;

transition:.2s;

}



</style>


</head>



<body>


<canvas id="game"></canvas>


<div id="msg"></div>





<script>


const canvas =
document.getElementById("game");


const ctx =
canvas.getContext("2d");



function resize(){

canvas.width=
innerWidth;

canvas.height=
innerHeight;

}


resize();


addEventListener(
"resize",
resize
);






// =====================
// 키 입력
// =====================


const keys={};


addEventListener(
"keydown",
e=>{


keys[e.code]=true;


});


addEventListener(
"keyup",
e=>{


keys[e.code]=false;


});






// =====================
// 게임 상태
// =====================


let started=false;

let winner=null;


let effects=[];


let items=[];



let last=0;









// =====================
// 플레이어 데이터
// =====================


class Player{


constructor(
x,y,color,keys
){


this.x=x;

this.y=y;


this.color=color;


this.keys=keys;



this.hp=7;


this.angle=0;



this.speed=240;



this.attackTime=0;


this.cool=0;


this.lastAttack=0;


this.strong=false;


this.attackLock=false;



this.damageBoost=false;


this.invincible=0;



this.kx=0;


this.ky=0;



this.walk=0;



}







update(enemy,dt){



let dx=0;

let dy=0;



if(keys[this.keys.up])
dy--;


if(keys[this.keys.down])
dy++;


if(keys[this.keys.left])
dx--;


if(keys[this.keys.right])
dx++;





if(dx||dy){


let l=Math.hypot(dx,dy);


dx/=l;

dy/=l;


this.x+=dx*this.speed*dt;


this.y+=dy*this.speed*dt;


this.walk+=dt*10;


}





this.angle=
Math.atan2(
enemy.y-this.y,
enemy.x-this.x
);






if(this.cool>0)

this.cool-=dt;



if(this.attackTime>0)

this.attackTime-=dt;




if(
keys[this.keys.attack]
&&
!this.attackLock
&&
this.cool<=0
){


let now=
performance.now();



this.strong=
now-this.lastAttack<300;


this.lastAttack=now;



this.attackTime=.35;



this.cool=
this.strong?1.2:.7;



this.attackLock=true;



}




if(
!keys[this.keys.attack]
)

this.attackLock=false;






if(this.invincible>0)

this.invincible-=dt;




}

// =====================
// 플레이어 그리기
// =====================


Player.prototype.draw=function(){


ctx.save();


ctx.translate(
this.x,
this.y
);




// 그림자

ctx.fillStyle="rgba(0,0,0,.35)";

ctx.beginPath();

ctx.ellipse(
0,
35,
28,
10,
0,
0,
Math.PI*2
);

ctx.fill();






// 망토

let wave=
Math.sin(this.walk)*6;



ctx.fillStyle=this.color;


ctx.beginPath();


ctx.moveTo(
0,
-20
);


ctx.quadraticCurveTo(
-40-wave,
10,
-35+wave,
55
);


ctx.quadraticCurveTo(
0,
70,
35-wave,
55
);


ctx.quadraticCurveTo(
40+wave,
10,
0,
-20
);


ctx.fill();








// 다리


ctx.strokeStyle="#111";

ctx.lineWidth=9;

ctx.lineCap="round";


ctx.beginPath();


ctx.moveTo(
-8,
20
);


ctx.lineTo(
-12,
45
);



ctx.moveTo(
8,
20
);


ctx.lineTo(
12,
45
);


ctx.stroke();








// 몸통 갑옷


ctx.fillStyle="#292929";


ctx.beginPath();


ctx.roundRect(
-18,
-20,
36,
45,
8
);


ctx.fill();







// 머리


ctx.fillStyle="#d79a70";


ctx.beginPath();


ctx.arc(
0,
-35,
14,
0,
Math.PI*2
);


ctx.fill();





// 머리카락


ctx.fillStyle="#111";


ctx.beginPath();


ctx.arc(
0,
-41,
15,
Math.PI,
Math.PI*2
);


ctx.fill();







// 공격 방향 팔


ctx.rotate(
this.angle
);



ctx.strokeStyle="#d79a70";


ctx.lineWidth=7;


ctx.beginPath();


ctx.moveTo(
10,
0
);


ctx.lineTo(
25,
0
);


ctx.stroke();






ctx.restore();



};









// =====================
// 검 시스템
// =====================


class Sword{


constructor(owner){


this.owner=owner;


this.hit=false;


}





update(){


if(
this.owner.attackTime<=0
)

this.hit=false;



}







attack(enemy){



let p=this.owner;



if(
p.attackTime<=0
||
this.hit
)

return;





let dist=
Math.hypot(
enemy.x-p.x,
enemy.y-p.y
);



if(
dist>140
)

return;





let a=
Math.atan2(
enemy.y-p.y,
enemy.x-p.x
);





let diff=
Math.abs(
Math.atan2(
Math.sin(a-p.angle),
Math.cos(a-p.angle)
)
);







if(
diff<0.9
){



let damage=1;

let power=500;





if(
p.strong
){

damage*=2;

power*=1.5;


}



if(
p.damageBoost
){


damage*=2;


p.damageBoost=false;


}






if(
enemy.invincible<=0
){


enemy.hp-=damage;


enemy.kx=
Math.cos(p.angle)*power;


enemy.ky=
Math.sin(p.angle)*power;



hitEffect(
enemy.x,
enemy.y
);



}



this.hit=true;



}



}









draw(){



let p=this.owner;



ctx.save();



ctx.translate(
p.x,
p.y
);



ctx.rotate(
p.angle
);




// 세로 검


ctx.fillStyle="#eee";


ctx.beginPath();


ctx.moveTo(
0,
-20
);


ctx.lineTo(
-8,
-100
);


ctx.lineTo(
8,
-100
);


ctx.closePath();


ctx.fill();






// 손잡이


ctx.fillStyle="#5b3518";


ctx.fillRect(
-5,
0,
10,
30
);






// 가드


ctx.strokeStyle="#d6aa45";


ctx.lineWidth=5;


ctx.beginPath();


ctx.moveTo(
-15,
0
);


ctx.lineTo(
15,
0
);


ctx.stroke();




ctx.restore();


}


}
  // =====================
// 맵 시스템
// =====================


function drawMap(){


// 사막 배경

ctx.fillStyle="#b98a52";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);





// 절벽 그림자

ctx.fillStyle="#4a3020";


ctx.beginPath();


ctx.ellipse(
canvas.width/2,
canvas.height/2+30,
480,
280,
0,
0,
Math.PI*2
);


ctx.fill();







// 돌 경기장


ctx.fillStyle="#766754";


ctx.beginPath();


ctx.ellipse(
canvas.width/2,
canvas.height/2,
410,
230,
0,
0,
Math.PI*2
);


ctx.fill();







// 돌 바닥 무늬


ctx.strokeStyle="rgba(40,30,20,.35)";


ctx.lineWidth=2;



for(let i=0;i<12;i++){


let a=
Math.PI*2*i/12;



ctx.beginPath();


ctx.moveTo(
canvas.width/2,
canvas.height/2
);


ctx.lineTo(
canvas.width/2+
Math.cos(a)*350,

canvas.height/2+
Math.sin(a)*180

);


ctx.stroke();


}







// 중앙 문양


ctx.strokeStyle="#c9a35b";


ctx.lineWidth=5;


ctx.beginPath();


ctx.arc(
canvas.width/2,
canvas.height/2,
90,
0,
Math.PI*2
);


ctx.stroke();



ctx.beginPath();


ctx.arc(
canvas.width/2,
canvas.height/2,
35,
0,
Math.PI*2
);


ctx.stroke();








// 폐허 기둥


drawRuins(
150,
150
);


drawRuins(
canvas.width-180,
160
);



}





function drawRuins(x,y){



ctx.fillStyle="#5d4934";


ctx.fillRect(
x,
y,
35,
100
);



ctx.fillStyle="#8c704b";


ctx.fillRect(
x,
y,
10,
100
);



}









// =====================
// 아이템 시스템
// =====================


let itemCount=0;



function spawnItem(){


if(itemCount>=2)
return;



let list=[
"heal",
"gold",
"shield"
];



items.push({

x:
canvas.width/2+
(Math.random()*300-150),

y:
canvas.height/2+
(Math.random()*150-75),

type:
list[
Math.floor(
Math.random()*list.length
)
],

active:true


});


itemCount++;


}






let itemTimer=0;



function updateItems(dt){



itemTimer+=dt;



if(
itemTimer>10
){


spawnItem();


itemTimer=0;


}







for(let i of items){



if(!i.active)
continue;



for(
let p of [player1,player2]
){



let d=
Math.hypot(
p.x-i.x,
p.y-i.y
);



if(d<45){



if(i.type==="heal"){


p.hp=Math.min(
7,
p.hp+2
);


}



if(i.type==="gold"){


p.damageBoost=true;


}



if(i.type==="shield"){


p.invincible=2;


}



i.active=false;



showMessage(
i.type
);



}


}



}



}









function drawItems(){



for(let i of items){



if(!i.active)
continue;



ctx.save();


ctx.translate(
i.x,
i.y
);





if(i.type==="heal"){



ctx.fillStyle="#35e06f";


ctx.fillRect(
-12,
-15,
24,
30
);



}



if(i.type==="gold"){



ctx.fillStyle="#ffd43b";


ctx.beginPath();


ctx.moveTo(
0,
-25
);


ctx.lineTo(
15,
10
);


ctx.lineTo(
-15,
10
);


ctx.fill();



}



if(i.type==="shield"){



ctx.fillStyle="#4db8ff";


ctx.beginPath();


ctx.arc(
0,
0,
20,
0,
Math.PI*2
);


ctx.fill();



}



ctx.restore();



}


}









// =====================
// 효과
// =====================



function hitEffect(x,y){


effects.push({

x:x,

y:y,

life:.25,

size:10

});


}







function drawEffects(){



for(let e of effects){



ctx.globalAlpha=
e.life/.25;



ctx.fillStyle="#ffdd55";


ctx.beginPath();


ctx.arc(
e.x,
e.y,
e.size,
0,
Math.PI*2
);


ctx.fill();



e.size+=3;

e.life-=0.02;



}



ctx.globalAlpha=1;



effects=
effects.filter(
e=>e.life>0
);



}







function showMessage(t){


let m=
document.getElementById("msg");


m.innerText=t;


m.style.opacity=1;



setTimeout(()=>{


m.style.opacity=0;


},1000);



}
  // =====================
// 플레이어 생성
// =====================


let player1 =
new Player(

canvas.width*0.35,

canvas.height/2,

"#2458d6",

{

up:"KeyW",

down:"KeyS",

left:"KeyA",

right:"KeyD",

attack:"KeyQ"

}

);





let player2 =
new Player(

canvas.width*0.65,

canvas.height/2,

"#d62828",

{

up:"ArrowUp",

down:"ArrowDown",

left:"ArrowLeft",

right:"ArrowRight",

attack:"Numpad0"

}

);





let sword1=
new Sword(player1);


let sword2=
new Sword(player2);








// =====================
// 물리
// =====================


function physics(p,dt){


p.x+=p.kx*dt;

p.y+=p.ky*dt;



p.kx*=0.88;

p.ky*=0.88;



}




function checkArena(p){



let dx=
p.x-canvas.width/2;


let dy=
p.y-canvas.height/2;



let value=

(dx*dx)/(410*410)
+
(dy*dy)/(230*230);




if(value>1){



p.hp=0;


winner=
p===player1
?
"RED"
:
"BLUE";


}



}








// =====================
// UI
// =====================


function drawHP(p,x){



ctx.fillStyle="rgba(0,0,0,.5)";


ctx.fillRect(
x,
40,
220,
20
);




ctx.fillStyle=p.color;


ctx.fillRect(
x,
40,
220*(p.hp/7),
20
);



ctx.strokeStyle="#fff";


ctx.strokeRect(
x,
40,
220,
20
);



}








function startScreen(){



ctx.fillStyle=
"rgba(0,0,0,.75)";


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



ctx.textAlign="center";



ctx.fillStyle="#d6aa45";


ctx.font="70px serif";


ctx.fillText(

"ANCIENT DUEL",

canvas.width/2,

220

);



ctx.fillStyle="#fff";


ctx.font="28px sans-serif";


ctx.fillText(

"SPACE 를 눌러 시작",

canvas.width/2,

350

);



ctx.font="20px sans-serif";


ctx.fillText(

"BLUE : WASD + Q",

canvas.width/2,

430

);


ctx.fillText(

"RED : 방향키 + 숫자패드 0",

canvas.width/2,

470

);



}









function winScreen(){



ctx.fillStyle=
"rgba(0,0,0,.7)";


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



ctx.textAlign="center";


ctx.fillStyle="#ffd43b";


ctx.font="70px serif";



ctx.fillText(

winner+" WIN",

canvas.width/2,

canvas.height/2

);



ctx.fillStyle="#fff";


ctx.font="25px sans-serif";


ctx.fillText(

"R 키로 재시작",

canvas.width/2,

canvas.height/2+60

);



}









// =====================
// 시작 / 재시작
// =====================


addEventListener(
"keydown",
e=>{


if(
e.code==="Space"
&&!started
){


started=true;


}



if(
e.code==="KeyR"
&&winner
){


location.reload();


}



});









// =====================
// 게임 루프
// =====================


function loop(t){



let dt=
(t-last)/1000;


last=t;



if(dt>0.05)

dt=0.05;





if(!started){


startScreen();


requestAnimationFrame(loop);

return;


}






if(!winner){



player1.update(
player2,
dt
);


player2.update(
player1,
dt
);






sword1.update();


sword2.update();




sword1.attack(
player2
);


sword2.attack(
player1
);






physics(
player1,
dt
);


physics(
player2,
dt
);



checkArena(player1);

checkArena(player2);




updateItems(dt);




}




// 그리기


drawMap();


drawItems();



player1.draw();

player2.draw();



sword1.draw();

sword2.draw();



drawEffects();



drawHP(
player1,
40
);



drawHP(
player2,
canvas.width-260
);




if(winner)

winScreen();




requestAnimationFrame(loop);


}



requestAnimationFrame(loop);



</script>


</body>

</html>
