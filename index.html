<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CODE : 검혼(劍魂)</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    font-family:"Noto Serif KR",serif;
}

body{
    overflow:hidden;
    background:#000;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
}

canvas{
    position:absolute;
    left:0;
    top:0;
}


/* HUD */

#hud{
    position:absolute;
    top:20px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 60px;
    z-index:5;
}


.playerUI{
    width:300px;
    text-align:center;
    color:white;
}


.name{
    font-size:32px;
    color:#e5c45a;
    text-shadow:0 0 15px #000;
}


.hpBox{
    margin-top:10px;
    height:25px;
    border:3px solid #d4af37;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}


.hp{
    height:100%;
    width:100%;
    transition:.3s;
}


#hp1{
    background:linear-gradient(
        90deg,
        #ff2222,
        #ff9900
    );
}


#hp2{
    background:linear-gradient(
        90deg,
        #00bfff,
        #0044ff
    );
}


/* 쿨타임 */

.cool{
    width:70px;
    height:70px;

    margin:15px auto;

    border-radius:50%;

    border:5px solid #d4af37;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;

    color:white;

    background:
    conic-gradient(
        #d4af37 360deg,
        transparent 0deg
    );

    box-shadow:0 0 20px #d4af37;
}



/* 메시지 */

#message{

    position:absolute;

    top:35%;
    left:50%;

    transform:
    translate(-50%,-50%)
    scale(.8);

    opacity:0;

    transition:.4s;

    text-align:center;

    color:white;

    z-index:10;
}


#message.show{

    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1);

}


#msgTitle{

    font-size:45px;

    color:#ffd700;

    text-shadow:
    0 0 20px black;

}


#msgText{

    margin-top:15px;

    font-size:24px;

    line-height:1.5;

    text-shadow:
    0 0 15px black;

}


/* 시작 */

#start,
#win{

    position:absolute;

    width:100%;
    height:100%;

    background:
    radial-gradient(
        circle,
        rgba(80,60,20,.9),
        black
    );

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    z-index:20;

}


#start h1,
#win h1{

    font-size:70px;

    color:#d4af37;

    text-shadow:
    0 0 30px black;

}


button{

    margin-top:40px;

    padding:15px 60px;

    font-size:25px;

    border:0;

    border-radius:15px;

    background:
    linear-gradient(
        45deg,
        #7a0000,
        #d4af37
    );

    color:white;

}


#win{
    display:none;
}

</style>
</head>


<body>

<div id="game">

<canvas id="canvas"></canvas>


<div id="hud">

<div class="playerUI">

<div class="name">
🔴 적운(赤雲)
</div>

<div class="hpBox">
<div id="hp1" class="hp"></div>
</div>

<div id="cool1" class="cool">
Q
</div>

</div>


<div class="playerUI">

<div class="name">
🔵 청월(靑月)
</div>

<div class="hpBox">
<div id="hp2" class="hp"></div>
</div>

<div id="cool2" class="cool">
0
</div>

</div>

</div>



<div id="message">

<div id="msgTitle"></div>

<div id="msgText"></div>

</div>


<div id="start">

<h1>
CODE : 검혼(劍魂)
</h1>

<p>
무림 최강의 검객을 가려라
</p>

<button onclick="startGame()">
결투 시작
</button>

</div>


<div id="win">

<h1 id="winner"></h1>

<button onclick="location.reload()">
다시 결투
</button>

</div>


<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;


const keys = {};

let gameRunning = false;
let itemList = [];

let messageTimeout;



window.addEventListener("keydown", e=>{

    keys[e.key.toLowerCase()] = true;


    if(e.key.toLowerCase()==="q")
        p1.attack();


    if(e.key==="0")
        p2.attack();

});


window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});





class Player{


constructor(x,y,color,name,control){


    this.x=x;
    this.y=y;


    this.color=color;
    this.name=name;


    this.hp=5;


    this.speed=5;


    this.size=35;


    this.control=control;


    this.dir =
    color==="crimson"
    ?1:-1;



    this.cooldown=0;


    this.swing=0;


    this.knock=0;


    this.invincible=0;


    this.golden=false;


}



update(){


    if(this.cooldown>0)
        this.cooldown--;


    if(this.swing>0)
        this.swing--;


    if(this.invincible>0)
        this.invincible--;



    this.move();



    if(this.knock!==0){

        this.x+=this.knock;

        this.knock*=0.85;


        if(Math.abs(this.knock)<0.2)
            this.knock=0;

    }



}




move(){


    let dx=0;
    let dy=0;



    if(keys[this.control.left])
        dx--;

    if(keys[this.control.right])
        dx++;

    if(keys[this.control.up])
        dy--;

    if(keys[this.control.down])
        dy++;



    this.x+=dx*this.speed;
    this.y+=dy*this.speed;



    if(dx!==0)
        this.dir=dx>0?1:-1;



    this.x=Math.max(
        50,
        Math.min(
            canvas.width-50,
            this.x
        )
    );


    this.y=Math.max(
        150,
        Math.min(
            canvas.height-50,
            this.y
        )
    );


}




attack(){


    if(this.cooldown>0)
        return;



    // 0.6초

    this.cooldown=36;


    this.swing=15;



    hit(this);


}



draw(){


ctx.save();


ctx.translate(
    this.x,
    this.y
);



/* 그림자 */

ctx.fillStyle="rgba(0,0,0,.5)";

ctx.beginPath();

ctx.ellipse(
    0,
    45,
    40,
    12,
    0,
    0,
    Math.PI*2
);

ctx.fill();





/* 몸 */

ctx.fillStyle=this.color;


ctx.beginPath();

ctx.arc(
    0,
    0,
    this.size,
    0,
    Math.PI*2
);

ctx.fill();




/* 머리 */

ctx.fillStyle="#f1c7a0";

ctx.beginPath();

ctx.arc(
    0,
    -45,
    16,
    0,
    Math.PI*2
);

ctx.fill();





/* 검 */


ctx.save();


if(this.swing){

    ctx.rotate(
        this.dir*0.8
    );

}



ctx.fillStyle =
this.golden
?"gold"
:"#ddd";



ctx.fillRect(

    this.dir*25,

    -75,

    10,

    110

);



ctx.restore();




/* 베기 이펙트 */

if(this.swing){


ctx.strokeStyle=
this.golden
?"gold"
:"white";


ctx.lineWidth=8;


ctx.beginPath();


ctx.arc(
    this.dir*30,
    0,
    80,
    -1,
    1
);


ctx.stroke();


}





/* 무적 */

if(this.invincible){


ctx.strokeStyle="#33ccff";

ctx.lineWidth=5;


ctx.beginPath();


ctx.arc(
    0,
    0,
    60,
    0,
    Math.PI*2
);


ctx.stroke();



}



ctx.restore();


}


}




const p1 = new Player(
    200,
    canvas.height/2,
    "crimson",
    "적운",
    {
        up:"w",
        down:"s",
        left:"a",
        right:"d"
    }
);



const p2 = new Player(
    canvas.width-200,
    canvas.height/2,
    "royalblue",
    "청월",
    {
        up:"arrowup",
        down:"arrowdown",
        left:"arrowleft",
        right:"arrowright"
    }
);





function hit(attacker){


let target =
attacker===p1
?p2
:p1;



let distance=Math.abs(
    attacker.x-target.x
);



if(distance<120){



    if(target.invincible)
        return;



    let damage=1;

    let push=30;



    if(attacker.golden){


        damage=2;

        push=60;


        attacker.golden=false;


    }



    target.hp-=damage;


    target.knock =
    attacker.dir*push;



    updateHP();



    if(target.hp<=0)

        endGame(attacker);



}


}



function updateHP(){


document.getElementById("hp1")
.style.width=
(p1.hp/5*100)+"%";


document.getElementById("hp2")
.style.width=
(p2.hp/5*100)+"%";


}
/* =========================
        아이템 시스템
========================= */


const itemData = [

{
    type:"gold",
    title:"⚔ 황금검 등장!",
    text:
    "다음 공격 데미지 2배<br>넉백 효과 2배<br>1회 사용 후 소멸"
},

{
    type:"shield",
    title:"🛡 무적 기운 등장!",
    text:
    "3초 동안 모든 공격 무시"
},

{
    type:"heal",
    title:"💚 생명의 영약 등장!",
    text:
    "체력 2 회복"
}

];



class Item{


constructor(){


    let data =
    itemData[
        Math.floor(
            Math.random()*itemData.length
        )
    ];


    this.type=data.type;

    this.title=data.title;

    this.text=data.text;


    this.x =
    Math.random()*
    (canvas.width-200)+100;


    this.y =
    Math.random()*
    (canvas.height-300)+180;


    this.size=25;


    this.active=true;


}




draw(){


if(!this.active)
    return;



ctx.save();


ctx.translate(
    this.x,
    this.y
);



if(this.type==="gold"){


    ctx.fillStyle="gold";


    ctx.fillRect(
        -8,
        -35,
        16,
        70
    );


    ctx.shadowColor="gold";
    ctx.shadowBlur=20;


}



else if(this.type==="shield"){


    ctx.fillStyle="#22ccff";


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        28,
        0,
        Math.PI*2
    );


    ctx.fill();



}



else{


    ctx.fillStyle="#44ff55";


    ctx.fillRect(
        -18,
        -25,
        36,
        50
    );


}



ctx.restore();



}


}




function createItem(){


let item=new Item();


itemList.push(item);


showMessage(
    item.title,
    item.text
);


}





function checkItems(player){


itemList.forEach(item=>{


if(!item.active)
    return;



let d=Math.hypot(
    player.x-item.x,
    player.y-item.y
);



if(d<60){


    item.active=false;


    useItem(
        player,
        item.type
    );


}



});


}





function useItem(player,type){



if(type==="gold"){


    player.golden=true;


    showMessage(

        "⚔ 황금검 획득!",

        "다음 베기 공격<br>피해량 ×2 / 넉백 ×2"

    );


}




if(type==="shield"){


    player.invincible=180;


    showMessage(

        "🛡 무적 발동!",

        "3초 동안 공격을 받지 않습니다"

    );


}




if(type==="heal"){



    player.hp+=2;


    if(player.hp>5)
        player.hp=5;



    updateHP();



    showMessage(

        "💚 영약 사용!",

        "체력 2 회복"

    );

}


}





/* =========================
       메시지
========================= */


function showMessage(title,text){



const box=
document.getElementById("message");



document.getElementById("msgTitle")
.innerHTML=title;



document.getElementById("msgText")
.innerHTML=text;



box.classList.add("show");



clearTimeout(messageTimeout);



messageTimeout=setTimeout(()=>{


box.classList.remove("show");


},2500);



}





/* =========================
       쿨타임 UI
========================= */


function updateCooldown(){



let c1 =
document.getElementById("cool1");


let c2 =
document.getElementById("cool2");



let p1Rate =
p1.cooldown/36;


let p2Rate =
p2.cooldown/36;



c1.style.background=

`conic-gradient(
gold ${360-(p1Rate*360)}deg,
transparent 0deg
)`;



c2.style.background=

`conic-gradient(
gold ${360-(p2Rate*360)}deg,
transparent 0deg
)`;


}






/* =========================
        배경
========================= */


function drawBackground(){



let bg =
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);



bg.addColorStop(
0,
"#08130d"
);


bg.addColorStop(
1,
"#020202"
);



ctx.fillStyle=bg;


ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);




/* 달 */


ctx.fillStyle="#fff1b0";


ctx.beginPath();


ctx.arc(
canvas.width/2,
120,
70,
0,
Math.PI*2
);


ctx.fill();





/* 대나무 */


for(let i=0;i<20;i++){


ctx.strokeStyle="#123b20";

ctx.lineWidth=15;


ctx.beginPath();


ctx.moveTo(
i*100,
canvas.height
);


ctx.lineTo(
i*100+30,
150
);


ctx.stroke();


}



}
/* =========================
        게임 루프
========================= */


function loop(){


if(!gameRunning)
    return;



drawBackground();



p1.update();

p2.update();



itemList.forEach(item=>{

    item.draw();

});



checkItems(p1);
checkItems(p2);



p1.draw();
p2.draw();



updateCooldown();



requestAnimationFrame(loop);


}







/* =========================
       아이템 생성
========================= */


let itemTimer;


function startItemTimer(){


itemTimer=setInterval(()=>{


if(gameRunning){

    createItem();

}


},8000);


}







/* =========================
       승리
========================= */


function endGame(player){



gameRunning=false;



document.getElementById("win")
.style.display="flex";



document.getElementById("winner")
.innerHTML=

"🏆 "
+
player.name
+
" 승리!";



}







/* =========================
       시작
========================= */


function startGame(){



document.getElementById("start")
.style.display="none";



gameRunning=true;



startItemTimer();



loop();



}





/* =========================
       리사이즈
========================= */


window.addEventListener(
"resize",
()=>{


canvas.width=innerWidth;

canvas.height=innerHeight;


});
